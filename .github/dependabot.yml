# Dependabot — GitHub Actions, and (from M0) the Rust workspace.
#
# experiments/ is standard-library-only by design (AGENTS.md), and
# tests/requirements-dev.txt is two pinned-by-floor test tools that a
# contributor installs locally, not something shipped to anyone. The `crates/`
# workspace (ADR-0006, ADR-0004) is real shipped third-party dependency surface
# and gets its own ecosystem below.
#
# `npm` entries for /app and /viewer are commented out below until M5/M6 scaffold
# those directories. They were live from M0 to the 0.0 truth-up pass under the
# assumption that a missing package.json makes Dependabot a silent no-op — measured
# wrong: it runs a "Dependabot Updates" job on every push to main that reports
# FAILURE (not skipped) for each ecosystem with no dependency file. Nothing here
# gates CI, but it trains reviewers to expect red on main, which is the thing we
# are correcting. Uncomment each block in the same commit that adds its package.json.
#
# Actions are pinned to major versions, so these PRs are rare and are the moments
# to look at what changed. Grouped into one PR per week so this never becomes
# background noise that gets auto-merged unread.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci

  # tests/requirements-dev.txt — test tooling only. Security updates matter here
  # because CI installs it; feature updates do not, so keep the cadence low.
  #
  # pytest is ignored above major: pytest>=9 requires Python >=3.10, and CI keeps
  # a deliberate 3.9 leg (see .github/workflows/ci.yml, and PR #9 which hit this
  # exact break). requirements-dev.txt already floor-splits by python_version
  # marker, so a major-version PR here would just get closed again — this rule
  # stops it from being re-proposed on every cadence run.
  - package-ecosystem: pip
    directory: "/tests"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      test-tooling:
        patterns:
          - "*"
    ignore:
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "test"
    labels:
      - dependencies

  # Root Cargo workspace (crates/*). The `licenses` CI job (cargo-deny, see
  # /deny.toml) is what actually gates a new dependency's license; dependabot
  # just keeps the pinned versions from going stale silently.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "cargo"
    labels:
      - dependencies
      - rust

  # /app (Tauri shell + Svelte UI) — scaffolded at M5. Uncomment once
  # app/package.json exists; see the note at the top of this file.
  # - package-ecosystem: npm
  #   directory: "/app"
  #   schedule:
  #     interval: weekly
  #     day: monday
  #     time: "09:00"
  #   open-pull-requests-limit: 5
  #   groups:
  #     npm-app:
  #       update-types:
  #         - "minor"
  #         - "patch"
  #   commit-message:
  #     prefix: "npm"
  #   labels:
  #     - dependencies
  #     - app

  # /viewer (zero-install recipient page) — scaffolded at M6. Uncomment once
  # viewer/package.json exists; see the note at the top of this file.
  # - package-ecosystem: npm
  #   directory: "/viewer"
