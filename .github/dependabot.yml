# Dependabot — GitHub Actions only.
#
# The only third-party code this repository depends on is the actions in
# .github/workflows/. experiments/ is standard-library-only by design (AGENTS.md),
# and tests/requirements-dev.txt is two pinned-by-floor test tools that a
# contributor installs locally, not something shipped to anyone.
#
# Actions are pinned to major versions, so these PRs are rare and are the moments
# to look at what changed. Grouped into one PR per week so this never becomes
# background noise that gets auto-merged unread.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci

  # tests/requirements-dev.txt — test tooling only. Security updates matter here
  # because CI installs it; feature updates do not, so keep the cadence low.
  - package-ecosystem: pip
    directory: "/tests"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      test-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: "test"
    labels:
      - dependencies
