# cargo-deny — machine-enforces the license boundary docs/FORMATS.md already
# argues in prose: Wit adopts ideas from DawVert and BBC audiowaveform, never
# their code, because both are GPL-3.0. See ADR-0004 (Rust core) and the
# `licenses` CI job in .github/workflows/ci.yml.
#
# Run locally: cargo deny check licenses advisories

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses only. Anything not listed here is refused by default
# (cargo-deny's `unlicensed` and unmatched-license behavior), which is the
# point: a new transitive dependency with a license we have not reviewed
# should fail the build, not slip through.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MPL-2.0",
  "Zlib",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
