[package]
name = "wit-audio"
version = "0.0.0"
description = "Audio engine: symphonia decode (wav/aiff/caf/alac/flac/mp4/mp3/aac), i8 min/max peaks for waveform rendering, FFT sample-alignment with a confidence gate, and the null-diff verdict ladder ported from experiments/null_diff.py. Works even when the project-file parser is blind."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Default features pull in codecs/formats we do not need (mkv, ogg, vorbis,
# id3 metadata, ...); the issue's scope is wav/aiff/caf/alac/flac/mp4/mp3/aac,
# so features are hand-picked to match exactly.
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "alac",
    "caf",
    "flac",
    "isomp4",
    "mp3",
    "pcm",
    "wav",
    "aiff",
] }
realfft = "3.5"

[dev-dependencies]
hound = "3.5"
