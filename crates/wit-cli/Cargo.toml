[package]
name = "wit-cli"
version = "0.0.0"
description = "The wit command-line tool. M1: wit diff-als. M2: wit logic-probe. M3: wit scan/dupes. wit log/diff/report land later."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wit-model = { path = "../wit-model" }
wit-als = { path = "../wit-als" }
wit-diff = { path = "../wit-diff" }
wit-logic = { path = "../wit-logic" }
wit-index = { path = "../wit-index" }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
flate2 = "1.0"
