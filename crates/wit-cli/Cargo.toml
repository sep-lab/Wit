[package]
name = "wit-cli"
version = "0.0.0"
description = "The wit command-line tool. M1: wit diff-als. M2: wit logic-probe. wit scan/log/diff/dupes/report land with M3 (wit-index)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wit-model = { path = "../wit-model" }
wit-als = { path = "../wit-als" }
wit-diff = { path = "../wit-diff" }
wit-logic = { path = "../wit-logic" }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
flate2 = "1.0"
