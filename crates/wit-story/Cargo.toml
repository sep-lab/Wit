[package]
name = "wit-story"
version = "0.0.0"
description = "The Story contract: what the app, the CLI and the share page show a musician, as typed JSON. Plus the builder that turns kept saves into a Story."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wit-model = { path = "../wit-model" }
wit-diff = { path = "../wit-diff" }
wit-als = { path = "../wit-als" }
wit-logic = { path = "../wit-logic" }
wit-index = { path = "../wit-index" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
tempfile = "3"
wit-demo = { path = "../wit-demo" }
