[package]
name = "wit-platform"
version = "0.0.0"
description = "Per-OS platform layer: path normalisation, discovery roots, a write-stability-debounced watcher, DAW-running detection, reveal/open, and the restore-as-copy primitives -- the only code in Wit that writes outside Wit's own data dir, and only ever into a validated Restores folder."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dunce = "1.0"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
reflink-copy = "0.1.30"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
unicode-normalization = "0.1.25"
wit-privacy = { path = "../wit-privacy" }

[dev-dependencies]
proptest = "1"
# File identity (dev, inode / volume, file index) for the property test's
# oracle, so "is this inside that folder?" is answered without trusting
# the path logic under test. Already in the tree via notify -> walkdir.
same-file = "1.0.6"
tempfile = "3"
