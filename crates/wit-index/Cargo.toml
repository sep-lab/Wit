[package]
name = "wit-index"
version = "0.0.0"
description = "Discovery, content-addressed store, SQLite registry. The only crate that writes Wit's app-data/scratch -- never to a project path (enforced by construction, not discipline). Restore copies are written by wit-platform, into a validated Restores folder only."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.5"
zstd = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
wit-logic = { path = "../wit-logic" }
wit-platform = { path = "../wit-platform" }

[dev-dependencies]
tempfile = "3"
