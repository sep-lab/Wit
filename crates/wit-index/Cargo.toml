[package]
name = "wit-index"
version = "0.0.0"
description = "Discovery, content-addressed store, SQLite registry. The ONLY crate that writes -- and only to app-data/scratch, never to a project path (enforced by construction, not discipline)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.5"
zstd = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
wit-logic = { path = "../wit-logic" }

[dev-dependencies]
tempfile = "3"
