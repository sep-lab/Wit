[pytest]
# Kept inside tests/ so the repository root stays free of tooling config while
# the prototypes remain dependency-free. Run with `pytest tests/` from the repo
# root, or `pytest` from inside tests/.
testpaths = .
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --strict-config
markers =
    real_fixtures: needs real DAW material; set WIT_FIXTURES=/path to enable
    slow: takes more than a second or shells out to zstd/git
filterwarnings =
    error
    # experiments/flp_parse.py does `data = open(path, "rb").read()` and never
    # closes the handle, so every call emits a ResourceWarning. The leak is pinned
    # deliberately by test_robustness.py::test_flp_parse_leaks_the_input_file_handle
    # (xfail, strict) — ignored here so it does not drown every other flp test.
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
xfail_strict = true
